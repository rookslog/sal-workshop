[project]
name = "sal"
version = "0.0.1"
description = "A command-line tool. Work in progress."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
]

[project.scripts]
sal = "sal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sal"]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "jsonschema>=4",
    "playwright>=1.50",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["browser: launches a real browser through Playwright"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".work"]

[tool.ruff.lint]
# Errors, pyflakes, warnings, import order, likely bugs, outdated syntax. Add a rule only when a
# real failure shows it is needed; tests/test_gate.py proves each check bites.
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
