name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      # The hosted macOS machine is too slow to keep the rows that time real playback in a browser
      # (12 of 537 failed there, all of that kind, with everything else passing). It runs every
      # test that needs no browser; hosted Linux and the local gate on a real Mac run them all.
      PYTEST_ADDOPTS: ${{ matrix.os == 'macos-latest' && '-m "not browser"' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: make setup
      - name: browsers (Linux)
        if: runner.os == 'Linux'
        run: .venv/bin/python -m playwright install --with-deps chromium webkit
      - run: make check
