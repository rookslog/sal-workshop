<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Round</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f8;
      --surface: #ffffff;
      --surface-alt: #f0f2f5;
      --border: #d5dbe3;
      --active-border: #1d4ed8;
      --active-tint: #f4f7ff;
      --ink: #181b20;
      --muted: #525866;
      --playhead: #dc2626;
      --selection-fill: rgba(29, 78, 216, 0.16);
      --selection-edge: #1d4ed8;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.4;
    }

    .page {
      max-width: 1680px;
      margin: 0 auto;
      padding: 14px 16px 28px;
    }

    .rail {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .video-stage {
      display: none;
    }

    .rail-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .topbar {
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    #question {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .transport-bar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .transport-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    #play {
      min-width: 72px;
      font-weight: 600;
    }

    #play[data-state="playing"] {
      border-color: var(--active-border);
      background: var(--active-tint);
      color: var(--active-border);
    }

    #time {
      font-family: var(--mono);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 16px;
      font-size: 13px;
      color: var(--muted);
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink);
      font-weight: 500;
      cursor: pointer;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .legend kbd {
      display: inline-block;
      padding: 1px 5px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--surface);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 11px;
    }

    #loop-status {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
    }

    #loop-status[data-active="true"] {
      color: var(--active-border);
      font-weight: 600;
    }

    #takes {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    .take {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--border);
      border-radius: 6px;
      min-width: 0;
    }

    .take.active {
      background: var(--active-tint);
      border-color: var(--active-border);
      border-left-width: 4px;
    }

    .take-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .take-title {
      display: flex;
      align-items: baseline;
      gap: 7px;
      min-width: 0;
    }

    .take-index {
      display: inline-block;
      padding: 0 5px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--surface-alt);
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      flex: 0 0 auto;
    }

    .take.active .take-index {
      border-color: var(--active-border);
      background: var(--active-border);
      color: #ffffff;
    }

    .take-label {
      font-weight: 600;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    .take-aside {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .take-gain {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      flex: 0 0 auto;
    }

    .take video {
      display: block;
      background: #101216;
      border-radius: 4px;
      object-fit: contain;
    }

    .take video.no-picture {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      pointer-events: none;
    }

    .take:not(.active) video.has-picture {
      width: 64px;
      height: 36px;
      flex: 0 0 auto;
    }

    .take.active video.has-picture {
      width: 360px;
      max-width: 100%;
      aspect-ratio: 16 / 9;
      cursor: pointer;
    }

    .view {
      position: relative;
      width: 100%;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      cursor: crosshair;
      user-select: none;
      -webkit-user-select: none;
    }

    .view-image {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
    }

    .selection {
      position: absolute;
      top: 0;
      bottom: 0;
      background: var(--selection-fill);
      border-left: 1.5px solid var(--selection-edge);
      border-right: 1.5px solid var(--selection-edge);
      pointer-events: none;
    }

    .comment-mark {
      position: absolute;
      top: 0;
      bottom: 0;
      background: rgba(217, 119, 6, 0.22);
      border-left: 1.5px solid #d97706;
      border-right: 1.5px solid #d97706;
      pointer-events: none;
    }

    .comment-mark.comment-mark-moment {
      width: 4px;
      border-left: none;
      border-right: none;
      background: rgba(217, 119, 6, 0.75);
      transform: translateX(-50%);
    }

    .playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--playhead);
      transform: translateX(-50%);
      pointer-events: none;
    }

    #comment-box {
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 100%;
    }

    #comment-box[hidden] {
      display: none;
    }

    .comment-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .comment-target {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--ink);
    }

    .comment-fields {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .comment-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    #comment-kind {
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 13px;
    }

    #comment-text {
      width: 100%;
      min-height: 72px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 13px;
      resize: vertical;
    }

    .comment-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .comment-buttons {
      display: flex;
      gap: 8px;
    }

    button {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 13px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #comment-status {
      font-size: 12px;
      color: var(--muted);
    }

    @media (min-width: 1120px) {
      .rail {
        position: fixed;
        top: 14px;
        left: 16px;
        bottom: 14px;
        width: 512px;
        margin-bottom: 0;
        z-index: 20;
      }

      .video-stage {
        display: block;
        width: 512px;
        height: 288px;
        flex: 0 0 auto;
        border-radius: 6px;
        background: #101216;
      }

      .video-stage[hidden] {
        display: none;
      }

      .rail-body {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
      }

      #takes {
        margin-left: 530px;
      }

      .take.active video.has-picture {
        position: fixed;
        top: 14px;
        left: 16px;
        width: 512px;
        height: 288px;
        border-radius: 6px;
        z-index: 30;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <aside class="rail">
      <div id="video-stage" class="video-stage" hidden></div>
      <div class="rail-body">
        <header class="topbar">
          <h1 id="question">__QUESTION_TEXT__</h1>
        </header>

        <section class="transport-bar" aria-label="Transport">
          <div class="transport-row">
            <button id="play" type="button" data-state="paused">Play</button>
            <span id="time">0:00.0 / 0:00.0</span>
          </div>
          <div class="controls">
            <label class="toggle">
              <input type="checkbox" id="level-match" checked>
              <span>Level match</span>
            </label>
            <span id="loop-status" data-active="false">Loop: off</span>
          </div>
        </section>

        <section id="comment-box" hidden aria-label="Comment">
          <div class="comment-meta">
            <span id="comment-target" class="comment-target"></span>
            <div class="comment-row">
              <label for="comment-kind">Kind</label>
              <select id="comment-kind">
                <option value="flag">flag</option>
                <option value="question">question</option>
                <option value="request">request</option>
                <option value="verdict">verdict</option>
              </select>
            </div>
          </div>
          <div class="comment-fields">
            <textarea id="comment-text" placeholder="Note what happens here..."></textarea>
            <div class="comment-actions">
              <span id="comment-status" data-state="offline">Offline: comments cannot be saved.</span>
              <div class="comment-buttons">
                <button id="comment-cancel" type="button">Cancel</button>
                <button id="comment-save" type="button" disabled>Save</button>
              </div>
            </div>
          </div>
        </section>

        <div class="legend">
          <span><kbd>Space</kbd> play/pause</span>
          <span><kbd>1</kbd>–<kbd>9</kbd> switch</span>
          <span><kbd>←</kbd>/<kbd>→</kbd> seek</span>
          <span><kbd>L</kbd> loop</span>
          <span><kbd>C</kbd> comment</span>
          <span><kbd>Esc</kbd> close</span>
        </div>
      </div>
    </aside>

    <main id="takes"></main>
  </div>

  <script id="page-data" type="application/json">__PAGE_DATA_JSON__</script>
  <script src="page.js"></script>
</body>
</html>
